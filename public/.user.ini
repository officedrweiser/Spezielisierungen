; PHP-Haertung fuer Webhosting mit PHP-FPM/FastCGI (z. B. Plesk bei A1).
; Apache mit mod_php ignoriert diese Datei, dort schuetzt die .htaccess.
; Ersetzt NICHT das PHP-Update beim Hoster, verkleinert aber die
; Angriffsflaeche fuer Luecken wie "PHP2Shell" (CVE-2026-109618/-109619).

; Fortschrittsanzeige fuer Datei-Uploads wird nicht gebraucht und war ein
; bestaetigter Angriffsweg.
session.upload_progress.enabled = 0

; Das Formular schickt wenige, flache Felder.
max_input_vars = 50
max_input_nesting_level = 8

; Fehlermeldungen nie an Besucher ausgeben.
display_errors = 0
